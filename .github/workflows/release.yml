name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: node

  bundle:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install and check
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check
      - name: Package skill
        run: |
          set -euo pipefail
          mkdir -p dist/bundle/diagram-canvas
          cp dist/skill/SKILL.md dist/skill/canvas.js dist/bundle/diagram-canvas/
          cd dist/bundle
          zip "../diagram-canvas-$RELEASE_TAG.zip" diagram-canvas/SKILL.md diagram-canvas/canvas.js
      - name: Verify bundle
        run: |
          set -euo pipefail
          archive="$PWD/dist/diagram-canvas-$RELEASE_TAG.zip"
          test "$(unzip -Z1 "$archive")" = $'diagram-canvas/SKILL.md\ndiagram-canvas/canvas.js'
          bundle_dir=$(mktemp -d -p /tmp diagram-canvas-skill-release-check.XXXXXX)
          unzip -q "$archive" -d "$bundle_dir"
          node "$bundle_dir/diagram-canvas/canvas.js" status diagrams
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "dist/diagram-canvas-$RELEASE_TAG.zip" --clobber
