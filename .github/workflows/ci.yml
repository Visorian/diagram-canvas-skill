name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install and check
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check
      - name: Check the committed skill matches the build
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- skills/)" ]; then
            echo "::error::skills/diagram-canvas/canvas.js is outdated. Run bun run build and commit it."
            exit 1
          fi
