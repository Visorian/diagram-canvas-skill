name: Diagram canvas viewer
description: Exports the diagrams to a read-only viewer page and uploads it as the GitHub Pages artifact.
inputs:
  diagrams:
    description: Folder with the diagram files, relative to the workspace.
    default: diagrams
runs:
  using: composite
  steps:
    - name: Export the diagrams
      shell: bash
      env:
        DIAGRAMS: ${{ inputs.diagrams }}
      run: |
        node "$GITHUB_ACTION_PATH/skills/diagram-canvas/canvas.js" export "$DIAGRAMS" \
          --out "$RUNNER_TEMP/diagram-canvas-pages/index.html"
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ runner.temp }}/diagram-canvas-pages
