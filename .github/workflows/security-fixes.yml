name: Security fixes

on:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches:
      - main
    paths:
      - bun.lock
  workflow_dispatch:

permissions: {}

jobs:
  bun:
    name: Bun
    permissions:
      contents: read
      pull-requests: read
    uses: visorian/public-workflows/.github/workflows/bun-security-fixes.yml@9bebf7cbf1022e7e7e75981e66b50787da4c02c3 # main
    with:
      app-client-id: ${{ vars.DEPENDENCY_UPDATES_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_PRIVATE_KEY }}
